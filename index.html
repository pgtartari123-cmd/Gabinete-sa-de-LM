<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Gabinete Digital</title>

  <link rel="manifest" href="manifesto.webmanifest">
  <link rel="stylesheet" href="estilo.css">
</head>

<body>

  <header class="topo">
    <div class="marca">
      <h1>Gabinete Digital</h1>
      <p>Cadastro • Saúde • Documentos • Agenda</p>
    </div>

    <nav class="menu" aria-label="Menu principal">
      <button type="button" onclick="mostrarAba('painel')">
        Painel
      </button>

      <button type="button" onclick="mostrarAba('pessoas')">
        Pessoas
      </button>

      <button type="button" onclick="mostrarAba('cadastro')">
        Novo cadastro
      </button>

      <button type="button" onclick="mostrarAba('demandas')">
        Demandas
      </button>

      <button type="button" onclick="mostrarAba('agenda')">
        Agenda
      </button>

      <button type="button" onclick="mostrarAba('aniversarios')">
        Aniversários
      </button>
    </nav>
  </header>


  <main>

    <!-- PAINEL -->
    <section id="painel" class="tab">
      <h2>Painel</h2>

      <div id="painelConteudo">
        <div class="card">
          <h3>Gabinete Digital</h3>
          <p>Central de atendimento e acompanhamento do gabinete.</p>
        </div>
      </div>
    </section>


    <!-- PESSOAS -->
    <section id="pessoas" class="tab">

      <h2>Pessoas</h2>

      <div class="acoes">
        <button type="button" onclick="imprimirPessoas()">
          PDF / Imprimir
        </button>
      </div>

      <div class="filtros">

        <input
          id="buscaPessoa"
          type="search"
          placeholder="Nome, CPF, telefone..."
          oninput="render()"
        >

        <input
          id="filtroBairro"
          type="search"
          placeholder="Bairro"
          oninput="render()"
        >

      </div>

      <div id="listaPessoas"></div>

    </section>


    <!-- NOVO CADASTRO -->
    <section id="cadastro" class="tab">

      <h2>Novo cadastro</h2>

      <form id="formCadastro">

        <div class="campo">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" required>
        </div>

        <div class="campo">
          <label for="mae">Nome da mãe</label>
          <input id="mae" name="mae" type="text">
        </div>

        <div class="campo">
          <label for="nascimento">Data de nascimento</label>
          <input id="nascimento" name="nascimento" type="date">
        </div>

        <div class="campo">
          <label for="cpf">CPF</label>
          <input id="cpf" name="cpf" type="text">
        </div>

        <div class="campo">
          <label for="sus">Cartão SUS</label>
          <input id="sus" name="sus" type="text">
        </div>

        <div class="campo">
          <label for="telefone">Telefone / WhatsApp</label>
          <input id="telefone" name="telefone" type="tel">
        </div>

        <div class="campo">
          <label for="bairro">Bairro</label>
          <input id="bairro" name="bairro" type="text">
        </div>

        <div class="campo">
          <label for="endereco">Endereço</label>
          <input id="endereco" name="endereco" type="text">
        </div>

        <div class="campo">
          <label for="demanda">Demanda</label>
          <input id="demanda" name="demanda" type="text">
        </div>

        <div class="campo">
          <label for="tipoDemanda">Tipo de demanda</label>

          <select id="tipoDemanda" name="tipoDemanda">
            <option value="">Selecione</option>
            <option value="Saúde">Saúde</option>
            <option value="Educação">Educação</option>
            <option value="Assistência Social">Assistência Social</option>
            <option value="Infraestrutura">Infraestrutura</option>
            <option value="Emprego">Emprego</option>
            <option value="Documentação">Documentação</option>
            <option value="Transporte">Transporte</option>
            <option value="Habitação">Habitação</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div class="campo">
          <label for="procedimento">Procedimento / Serviço</label>
          <input id="procedimento" name="procedimento" type="text">
        </div>

        <div class="campo">
          <label for="status">Status</label>

          <select id="status" name="status">
            <option value="Pendente">Pendente</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Concluído">Concluído</option>
          </select>
        </div>

        <button type="submit">
          Salvar cadastro
        </button>

      </form>

    </section>


    <!-- DEMANDAS -->
    <section id="demandas" class="tab">

      <h2>Demandas</h2>

      <div id="listaDemandas"></div>

    </section>


    <!-- AGENDA -->
    <section id="agenda" class="tab">

      <h2>Agenda</h2>

      <div id="listaAgenda"></div>

    </section>


    <!-- ANIVERSÁRIOS -->
    <section id="aniversarios" class="tab">

      <h2>Aniversários</h2>

      <div id="listaAniversarios"></div>

    </section>

  </main>


  <script src="app.js"></script>

  <script>
    function mostrarAba(id) {

      document.querySelectorAll('.tab').forEach(function(tab) {
        tab.style.display = 'none';
      });

      const aba = document.getElementById(id);

      if (aba) {
        aba.style.display = 'block';
      }

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    function imprimirPessoas() {
      window.print();
    }

    document.addEventListener('DOMContentLoaded', function() {

      mostrarAba('painel');

      if (typeof render === 'function') {
        render();
      }

      if (typeof renderDemanda === 'function') {
        renderDemanda();
      }

      if (typeof renderDemandas === 'function') {
        renderDemandas();
      }

      if (typeof renderAgenda === 'function') {
        renderAgenda();
      }

      if (typeof renderizarAniversários === 'function') {
        renderizarAniversários();
      }

      if (typeof renderBirthdays === 'function') {
        renderBirthdays();
      }
    });
  </script>

</body>
</html>
