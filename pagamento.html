<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9468f"><title>Pagamento — Gabinete LM</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7fb;color:#2b1b26;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(560px,100%);background:#fff;border:1px solid #f0d9e5;border-radius:24px;padding:28px;box-shadow:0 15px 45px #00000012}h1{margin:0 0 5px}.sub{color:#7a6270;margin:0 0 22px}.preco{font-size:34px;font-weight:900;margin:8px 0 20px;color:#be2f78}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}input,select{width:100%;padding:13px;border:1px solid #e6c5d6;border-radius:11px;font-size:15px}input:focus,select:focus{outline:0;border-color:#d9468f;box-shadow:0 0 0 3px #d9468f22}.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.opcao{border:2px solid #f0d9e5;border-radius:14px;padding:14px;cursor:pointer;background:#fff;text-align:left}.opcao.ativa{border-color:#d9468f;background:#fff7fb}.opcao strong{display:block}.opcao small{color:#7a6270}.acoes{margin-top:18px}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:#d9468f;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.msg{min-height:20px;margin-top:12px;font-size:13px;color:#b42318;text-align:center}.seguro{margin-top:18px;text-align:center;color:#7a6270;font-size:12px}@media(max-width:520px){.grid,.opcoes{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="box"><h1>💳 Gabinete LM</h1><p class="sub">Contratação da licença do sistema</p><div class="preco">R$ 4.300,00</div><form id="f"><div class="grid"><div class="full"><label>Nome completo *</label><input id="nome" required autocomplete="name"></div><div><label>E-mail *</label><input id="email" type="email" required autocomplete="email"></div><div><label>WhatsApp</label><input id="telefone" type="tel" autocomplete="tel"></div></div><label style="margin-top:18px">Forma de pagamento</label><div class="opcoes"><button type="button" class="opcao ativa" data-meio="pix"><strong>🟢 Pix</strong><small>Pagamento à vista</small></button><button type="button" class="opcao" data-meio="cartao"><strong>💳 Cartão de crédito</strong><small>À vista ou parcelado</small></button></div><div id="parcelas" style="display:none"><label>Tipo de pagamento</label><select id="tipo"><option value="unico">Pagamento único — 1x</option><option value="parcelado">Pagamento parcelado — até 12x</option></select></div><div class="acoes"><button id="go" class="btn" type="submit">Continuar para o Mercado Pago</button></div><div id="msg" class="msg"></div></form><div class="seguro">🔒 Você será direcionado para o ambiente seguro do Mercado Pago para concluir o pagamento.</div></main><script>const FN='https://qizakldwyeqbummhtpsg.supabase.co/functions/v1/mercadopago-public-checkout';let meio='pix';const botoes=[...document.querySelectorAll('.opcao')];function atual(){botoes.forEach(b=>b.classList.toggle('ativa',b.dataset.meio===meio));document.getElementById('parcelas').style.display=meio==='cartao'?'block':'none'}botoes.forEach(b=>b.onclick=()=>{meio=b.dataset.meio;atual()});document.getElementById('f').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('go'),msg=document.getElementById('msg');btn.disabled=true;btn.textContent='Preparando pagamento...';msg.textContent='';try{const tipo=meio==='cartao'?document.getElementById('tipo').value:'unico';const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:document.getElementById('nome').value,email:document.getElementById('email').value,telefone:document.getElementById('telefone').value,tipo_pagamento:tipo,meio_pagamento:meio,origin:location.origin+'/Gabinete-sa-de-LM/pagamento.html'})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Não foi possível iniciar o pagamento.');location.href=j.init_point||j.sandbox_init_point}catch(x){msg.textContent=x.message||String(x);btn.disabled=false;btn.textContent='Continuar para o Mercado Pago'}};</script></body></html>
